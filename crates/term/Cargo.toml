[package]
name = "mahzenterm-term"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
portable-pty = "0.9.0"
thiserror = "2.0.21"
tracing = "0.1.44"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mahzenterm-platform = { path = "../platform" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tempfile = "3"

[[bench]]
name = "throughput"
harness = false
