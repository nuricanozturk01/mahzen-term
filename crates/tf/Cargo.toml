[package]
name = "mahzenterm-tf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tf"
path = "src/main.rs"

[dependencies]
mahzenterm-viewer = { path = "../../modules/viewer" }
terminal_size = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "tga", "pnm", "qoi"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
parquet = { version = "60.1.0", default-features = false, features = ["snap", "flate2-rust_backened"] }
serde_json = "1.0.154"

[dev-dependencies]
mahzenterm-term = { path = "../term" }
