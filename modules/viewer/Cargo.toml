[package]
name = "mahzenterm-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mahzenterm-core = { path = "../../crates/core" }
calamine = "0.38.0"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
pulldown-cmark = { version = "0.13", default-features = false }
quick-xml = "0.42.0"
serde_json = "1.0.154"
sevenz-rust2 = "0.25.0"
tar = "0.4.46"
toml = "0.9"
unicode-width = "0.2"
yaml-rust2 = "0.13.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
sevenz-rust2 = { version = "0.25", features = ["compress"] }
tempfile = "3"
